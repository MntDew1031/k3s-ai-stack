---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: csi-driver-smb
  namespace: kube-system
spec:
  interval: 24h
  url: https://raw.githubusercontent.com/kubernetes-csi/csi-driver-smb/master/charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: csi-driver-smb
  namespace: kube-system
spec:
  interval: 10m
  chart:
    spec:
      chart: csi-driver-smb
      version: "v1.15.0"
      sourceRef:
        kind: HelmRepository
        name: csi-driver-smb
        namespace: kube-system
  values:
    # Use baseline settings suitable for k3s
    controller:
      replicas: 1
    node:
      tolerateAllTaints: true
