apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
  labels:
    # node-exporter needs hostNetwork/hostPID/hostPort/hostPath, which the
    # "baseline" level forbids (those are only allowed under "privileged").
    # With baseline enforced, PodSecurity blocks node-exporter on every node
    # except a grandfathered pod, so the DaemonSet sits at 1/N and helm --wait
    # hangs. Enforce privileged so node-exporter runs cluster-wide; the other
    # components (grafana, prometheus, alertmanager, kube-state-metrics, the
    # operator) each set their own restrictive securityContext, so they are
    # not loosened by this. audit/warn stay at restricted for visibility.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
