apiVersion: v1
kind: PersistentVolume
metadata:
  name: hermes-dropzone
  labels:
    app: hermes-agent
spec:
  capacity:
    storage: 100Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  mountOptions:
    - dir_mode=0777
    - file_mode=0777
    - uid=10000
    - gid=10000
    - mfsymlinks
    - cache=strict
    - noserverino
  csi:
    driver: smb.csi.k8s.io
    readOnly: false
    volumeHandle: hermes-dropzone-pv
    volumeAttributes:
      source: "//192.0.2.20/hermes-dropzone"
    nodeStageSecretRef:
      name: hermes-smb-secrets
      namespace: ai-stack
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hermes-dropzone
  namespace: ai-stack
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 100Gi
  volumeName: hermes-dropzone
  storageClassName: ""
