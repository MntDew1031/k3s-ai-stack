# Materialize one-time and weekly household vote schedules.
#
# Every 15 minutes the job interprets each schedule in its household's IANA
# timezone, opens due votes, fills cookable options, and sends the actionable
# APNs vote notification. DB uniqueness + last_materialized_on make retries
# idempotent; concurrencyPolicy prevents overlapping cluster runs.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: schedule-votes
  namespace: suppr
spec:
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 300
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app: schedule-votes
        spec:
          restartPolicy: Never
          imagePullSecrets:
            - name: regcred
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: schedule-votes
              image: example.invalid/private/backend:REDACTED
              imagePullPolicy: IfNotPresent
              command: ["python", "-m", "app.jobs.schedule_votes"]
              envFrom:
                - configMapRef: { name: suppr-config }
                - secretRef: { name: suppr-secrets }
              resources:
                requests: { cpu: "50m", memory: "128Mi" }
                limits: { cpu: "500m", memory: "512Mi" }
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: [ALL]
