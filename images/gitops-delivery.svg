<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520" role="img" aria-labelledby="title desc">
  <title id="title">GitOps delivery and validation flow</title>
  <desc id="desc">A five-step flow from reviewed source changes through validation, Git, Flux reconciliation, and observable cluster state.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081222"/>
      <stop offset="1" stop-color="#121b31"/>
    </linearGradient>
    <linearGradient id="step" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#152845"/>
      <stop offset="1" stop-color="#101d33"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#020617" flood-opacity="0.5"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#38bdf8"/>
    </marker>
    <marker id="loop" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a78bfa"/>
    </marker>
    <style>
      .title { font: 700 38px Inter, ui-sans-serif, system-ui, sans-serif; fill: #f8fafc; }
      .subtitle { font: 400 18px Inter, ui-sans-serif, system-ui, sans-serif; fill: #94a3b8; }
      .num { font: 750 18px Inter, ui-sans-serif, system-ui, sans-serif; fill: #07101f; }
      .step-title { font: 700 21px Inter, ui-sans-serif, system-ui, sans-serif; fill: #f1f5f9; }
      .copy { font: 500 15px Inter, ui-sans-serif, system-ui, sans-serif; fill: #cbd5e1; }
      .label { font: 650 14px Inter, ui-sans-serif, system-ui, sans-serif; letter-spacing: 1px; fill: #c4b5fd; }
    </style>
  </defs>

  <rect width="1600" height="520" rx="28" fill="url(#bg)"/>
  <text x="70" y="74" class="title">From commit to reconciled state</text>
  <text x="70" y="108" class="subtitle">Validation gates and observability close the loop without manual changes to the cluster.</text>

  <path d="M310 260 H350" stroke="#38bdf8" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M610 260 H650" stroke="#38bdf8" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M910 260 H950" stroke="#38bdf8" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M1210 260 H1250" stroke="#38bdf8" stroke-width="4" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="60" y="160" width="250" height="200" rx="20" fill="url(#step)" stroke="#2d4f75"/>
    <circle cx="95" cy="196" r="18" fill="#67e8f9"/>
    <text x="95" y="202" text-anchor="middle" class="num">1</text>
    <text x="125" y="203" class="step-title">Change</text>
    <text x="90" y="247" class="copy">Edit declarative state</text>
    <text x="90" y="276" class="copy">Review blast radius</text>
    <text x="90" y="305" class="copy">Keep secrets out of Git</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="360" y="160" width="250" height="200" rx="20" fill="url(#step)" stroke="#2d4f75"/>
    <circle cx="395" cy="196" r="18" fill="#67e8f9"/>
    <text x="395" y="202" text-anchor="middle" class="num">2</text>
    <text x="425" y="203" class="step-title">Validate</text>
    <text x="390" y="247" class="copy">Render Kustomizations</text>
    <text x="390" y="276" class="copy">Parse YAML and JSON</text>
    <text x="390" y="305" class="copy">Run unit + secret scans</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="660" y="160" width="250" height="200" rx="20" fill="url(#step)" stroke="#5b43a0"/>
    <circle cx="695" cy="196" r="18" fill="#c4b5fd"/>
    <text x="695" y="202" text-anchor="middle" class="num">3</text>
    <text x="725" y="203" class="step-title">Commit</text>
    <text x="690" y="247" class="copy">Reviewable Git history</text>
    <text x="690" y="276" class="copy">Single source of truth</text>
    <text x="690" y="305" class="copy">No direct cluster mutation</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="960" y="160" width="250" height="200" rx="20" fill="url(#step)" stroke="#5b43a0"/>
    <circle cx="995" cy="196" r="18" fill="#c4b5fd"/>
    <text x="995" y="202" text-anchor="middle" class="num">4</text>
    <text x="1025" y="203" class="step-title">Reconcile</text>
    <text x="990" y="247" class="copy">Flux detects revision</text>
    <text x="990" y="276" class="copy">Dependencies apply in order</text>
    <text x="990" y="305" class="copy">Drift is corrected</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1260" y="160" width="280" height="200" rx="20" fill="url(#step)" stroke="#277c72"/>
    <circle cx="1295" cy="196" r="18" fill="#5eead4"/>
    <text x="1295" y="202" text-anchor="middle" class="num">5</text>
    <text x="1325" y="203" class="step-title">Observe</text>
    <text x="1290" y="247" class="copy">Metrics and health probes</text>
    <text x="1290" y="276" class="copy">Alerts surface regressions</text>
    <text x="1290" y="305" class="copy">Evidence informs next change</text>
  </g>

  <path d="M1400 380 C1400 465 790 475 790 395" stroke="#a78bfa" stroke-width="3" stroke-dasharray="8 7" fill="none" marker-end="url(#loop)"/>
  <text x="1095" y="454" text-anchor="middle" class="label">FEEDBACK LOOP</text>
</svg>

