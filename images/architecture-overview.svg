<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Sanitized bare-metal K3s platform architecture</title>
  <desc id="desc">A GitOps source flows through Flux CD into a highly available K3s cluster containing infrastructure, AI platform, application, and observability layers.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07101f"/>
      <stop offset="0.55" stop-color="#0c1830"/>
      <stop offset="1" stop-color="#111c33"/>
    </linearGradient>
    <linearGradient id="blueCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12284b"/>
      <stop offset="1" stop-color="#10203b"/>
    </linearGradient>
    <linearGradient id="purpleCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b2050"/>
      <stop offset="1" stop-color="#1b1838"/>
    </linearGradient>
    <linearGradient id="greenCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#123c3b"/>
      <stop offset="1" stop-color="#102b31"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#020617" flood-opacity="0.45"/>
    </filter>
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#48cae4"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a78bfa"/>
    </marker>
    <style>
      .title { font: 700 42px Inter, ui-sans-serif, system-ui, sans-serif; fill: #f8fafc; }
      .subtitle { font: 400 20px Inter, ui-sans-serif, system-ui, sans-serif; fill: #94a3b8; }
      .eyebrow { font: 700 14px Inter, ui-sans-serif, system-ui, sans-serif; letter-spacing: 2px; fill: #67e8f9; }
      .card-title { font: 700 24px Inter, ui-sans-serif, system-ui, sans-serif; fill: #f8fafc; }
      .card-copy { font: 500 17px Inter, ui-sans-serif, system-ui, sans-serif; fill: #cbd5e1; }
      .chip { font: 650 14px Inter, ui-sans-serif, system-ui, sans-serif; fill: #e2e8f0; }
      .cluster-label { font: 700 17px Inter, ui-sans-serif, system-ui, sans-serif; letter-spacing: 1px; fill: #a5f3fc; }
      .small { font: 500 14px Inter, ui-sans-serif, system-ui, sans-serif; fill: #94a3b8; }
    </style>
  </defs>

  <rect width="1600" height="900" rx="28" fill="url(#background)"/>
  <circle cx="1420" cy="90" r="240" fill="#2563eb" opacity="0.08"/>
  <circle cx="180" cy="840" r="280" fill="#7c3aed" opacity="0.08"/>

  <text x="70" y="78" class="eyebrow">BARE-METAL PLATFORM ENGINEERING</text>
  <text x="70" y="130" class="title">GitOps-managed K3s homelab</text>
  <text x="70" y="166" class="subtitle">Documentation-only topology • live identities, endpoints, secrets, and image sources removed</text>

  <g filter="url(#shadow)">
    <rect x="70" y="250" width="245" height="175" rx="22" fill="url(#blueCard)" stroke="#2a4f7a" stroke-width="2"/>
    <circle cx="110" cy="292" r="16" fill="#22d3ee" opacity="0.18"/>
    <path d="M100 292h20M110 282v20" stroke="#67e8f9" stroke-width="3" stroke-linecap="round"/>
    <text x="140" y="301" class="card-title">Git source</text>
    <text x="100" y="344" class="card-copy">Declarative desired state</text>
    <text x="100" y="373" class="card-copy">Kustomize overlays</text>
    <text x="100" y="402" class="small">Sanitized portfolio mirror</text>
  </g>

  <path d="M325 338 C350 338 356 338 380 338" stroke="#48cae4" stroke-width="4" fill="none" marker-end="url(#arrowCyan)"/>

  <g filter="url(#shadow)">
    <rect x="395" y="250" width="245" height="175" rx="22" fill="url(#purpleCard)" stroke="#5b43a0" stroke-width="2"/>
    <circle cx="435" cy="292" r="16" fill="#8b5cf6" opacity="0.25"/>
    <path d="M427 292h16M435 284v16" stroke="#c4b5fd" stroke-width="3" stroke-linecap="round"/>
    <text x="465" y="301" class="card-title">Flux CD</text>
    <text x="425" y="344" class="card-copy">Continuous reconciliation</text>
    <text x="425" y="373" class="card-copy">Ordered dependencies</text>
    <text x="425" y="402" class="small">Drift correction + pruning</text>
  </g>

  <path d="M650 338 C680 338 680 338 710 338" stroke="#a78bfa" stroke-width="4" fill="none" marker-end="url(#arrowPurple)"/>

  <rect x="720" y="205" width="810" height="620" rx="30" fill="#0a1427" fill-opacity="0.72" stroke="#22d3ee" stroke-opacity="0.65" stroke-width="2.5" stroke-dasharray="10 8"/>
  <text x="760" y="244" class="cluster-label">HIGHLY AVAILABLE K3S CLUSTER</text>
  <text x="1475" y="244" text-anchor="end" class="small">role-based node names • documentation IPs</text>

  <g filter="url(#shadow)">
    <rect x="760" y="275" width="730" height="100" rx="18" fill="#11233e" stroke="#28517a"/>
    <text x="790" y="312" class="card-title">Infrastructure plane</text>
    <g>
      <rect x="790" y="330" width="110" height="28" rx="14" fill="#17365c"/><text x="845" y="349" text-anchor="middle" class="chip">kube-vip</text>
      <rect x="912" y="330" width="105" height="28" rx="14" fill="#17365c"/><text x="964" y="349" text-anchor="middle" class="chip">Cilium</text>
      <rect x="1029" y="330" width="120" height="28" rx="14" fill="#17365c"/><text x="1089" y="349" text-anchor="middle" class="chip">Longhorn</text>
      <rect x="1161" y="330" width="102" height="28" rx="14" fill="#17365c"/><text x="1212" y="349" text-anchor="middle" class="chip">SMB CSI</text>
      <rect x="1275" y="330" width="185" height="28" rx="14" fill="#17365c"/><text x="1367" y="349" text-anchor="middle" class="chip">GPU device plugins</text>
    </g>
  </g>

  <g filter="url(#shadow)">
    <rect x="760" y="405" width="350" height="230" rx="20" fill="url(#purpleCard)" stroke="#6950b8"/>
    <text x="790" y="447" class="eyebrow">AI PLATFORM</text>
    <text x="790" y="484" class="card-title">Private inference stack</text>
    <text x="790" y="520" class="card-copy">Ollama + NVIDIA GPU</text>
    <text x="790" y="550" class="card-copy">LiteLLM gateway + policy</text>
    <text x="790" y="580" class="card-copy">Open WebUI + memory + search</text>
    <rect x="790" y="598" width="187" height="25" rx="12" fill="#40306d"/>
    <text x="883" y="616" text-anchor="middle" class="chip">custom callbacks + tests</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1140" y="405" width="350" height="230" rx="20" fill="url(#greenCard)" stroke="#277c72"/>
    <text x="1170" y="447" class="eyebrow">APPLICATION PLATFORM</text>
    <text x="1170" y="484" class="card-title">Production-style workload</text>
    <text x="1170" y="520" class="card-copy">Web + API services</text>
    <text x="1170" y="550" class="card-copy">PostgreSQL + Redis</text>
    <text x="1170" y="580" class="card-copy">Backups + scheduled jobs</text>
    <rect x="1170" y="598" width="210" height="25" rx="12" fill="#18514e"/>
    <text x="1275" y="616" text-anchor="middle" class="chip">all image sources redacted</text>
  </g>

  <path d="M1125 520 C1115 520 1115 520 1125 520" stroke="#48cae4" stroke-width="3" fill="none"/>

  <g filter="url(#shadow)">
    <rect x="760" y="665" width="730" height="105" rx="18" fill="#111f34" stroke="#34506f"/>
    <text x="790" y="706" class="card-title">Observability and security</text>
    <g>
      <rect x="790" y="725" width="130" height="28" rx="14" fill="#19324f"/><text x="855" y="744" text-anchor="middle" class="chip">Prometheus</text>
      <rect x="932" y="725" width="100" height="28" rx="14" fill="#19324f"/><text x="982" y="744" text-anchor="middle" class="chip">Grafana</text>
      <rect x="1044" y="725" width="132" height="28" rx="14" fill="#19324f"/><text x="1110" y="744" text-anchor="middle" class="chip">Alertmanager</text>
      <rect x="1188" y="725" width="140" height="28" rx="14" fill="#19324f"/><text x="1258" y="744" text-anchor="middle" class="chip">Cilium telemetry</text>
      <rect x="1340" y="725" width="120" height="28" rx="14" fill="#19324f"/><text x="1400" y="744" text-anchor="middle" class="chip">default deny</text>
    </g>
  </g>

  <g>
    <rect x="70" y="500" width="570" height="265" rx="22" fill="#0b1629" stroke="#253b59" stroke-width="2"/>
    <text x="100" y="542" class="eyebrow">PHYSICAL LAYER</text>
    <text x="100" y="581" class="card-title">Five low-power x86 nodes</text>
    <text x="100" y="618" class="card-copy">3 × control-plane / etcd</text>
    <text x="100" y="650" class="card-copy">2 × worker nodes</text>
    <text x="100" y="682" class="card-copy">1 × NVIDIA-backed inference worker</text>
    <text x="100" y="730" class="small">Built to demonstrate reliability and platform depth under real resource constraints.</text>
  </g>

  <text x="80" y="858" class="small">Portfolio view • intentionally non-deployable • credentials and live infrastructure details are not present</text>
</svg>

